<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
	<title id="title">skin-code</title>
	<desc id="desc">A code card with coloured syntax lines, beside the words skin-code: VS Code themes for code in Claude Code.</desc>
	<rect width="1200" height="300" rx="24" fill="#ffffff"/>

	<!-- The mark: a code card with coloured syntax lines. -->
	<g transform="translate(96 16)">
		<!-- Card -->
		<rect x="8" y="56" width="192" height="156" rx="20" fill="#000000" stroke="#1f1f27" stroke-width="3"/>
		<line x1="8" y1="92" x2="200" y2="92" stroke="#1f1f27" stroke-width="3"/>
		<circle cx="32" cy="74" r="6" fill="#2492ff"/>
		<circle cx="52" cy="74" r="6" fill="#0aff04"/>
		<circle cx="72" cy="74" r="6" fill="#ffb46a"/>
		<!-- Syntax lines -->
		<rect x="28" y="110" width="40" height="12" rx="6" fill="#2492ff"/>
		<rect x="76" y="110" width="64" height="12" rx="6" fill="#df00df"/>
		<rect x="48" y="134" width="30" height="12" rx="6" fill="#0aff04"/>
		<rect x="86" y="134" width="22" height="12" rx="6" fill="#ff6106"/>
		<rect x="116" y="134" width="56" height="12" rx="6" fill="#fef611"/>
		<rect x="48" y="158" width="52" height="12" rx="6" fill="#a5a8ff"/>
		<rect x="108" y="158" width="36" height="12" rx="6" fill="#ffb46a"/>
		<rect x="28" y="182" width="18" height="12" rx="6" fill="#7f817e"/>
	</g>

	<!-- Wordmark -->
	<text x="356" y="164" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="104" font-weight="700" letter-spacing="-2">
		<tspan fill="#16161d">skin</tspan><tspan fill="#ff1190">-</tspan><tspan fill="#2492ff">code</tspan>
	</text>
	<text x="360" y="218" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="30" fill="#5c5c66">
		VS Code themes for the code in Claude Code
	</text>
</svg>
